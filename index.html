<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Dashboard Monitoring</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial;
}

/* RUNNING TEXT */
.ticker-wrap{
    width:100%;
    overflow:hidden;
    background:#000;
    color:white;
    height:50px;
    display:flex;
    align-items:center;
    border-bottom:2px solid #333;
}

.ticker{
    white-space:nowrap;
    display:inline-block;
    padding-left:100%;
    animation:ticker 20s linear infinite;
    font-size:24px;
    font-weight:bold;
}

@keyframes ticker{
    0%{
        transform:translateX(0);
    }

    100%{
        transform:translateX(-100%);
    }
}

/* DASHBOARD */
.dashboard{
    width:100%;
    height:calc(100vh - 50px);
    border:none;
}

</style>
</head>

<body>

<div class="ticker-wrap">
    <div class="ticker">
        Biaya KPPN Tasikmalaya 0 Rupiah
    </div>
</div>

<iframe>
class="dashboard"
src="https://datastudio.google.com/embed/reporting/c33df78a-b716-4e60-abc7-3ca8836afd10/page/6y4xF">
</iframe>

</body>
</html>
